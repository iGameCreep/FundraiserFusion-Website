<section class="page">
  <div *ngIf="!socketData">
    <h1 class="outfit title">Retrieving informations, Please wait...</h1>
  </div>
  <div *ngIf="socketData" class="card">
    <h1 class="outfit title">Success !</h1>

    <button (click)="copySocketToken()" class="btn btn-primary">Copy Socket Token</button>

    <button (click)="generateSecretsFile()" class="btn btn-success">Generate Secrets File</button>
  </div>
</section>
