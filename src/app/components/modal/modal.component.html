<div class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="outfit title">{{ title }}</h2>

      <div class="modal-buttons">
        <button
          *ngFor="let btn of buttons"
          [ngClass]="btn.class"
          (click)="handleButtonClick($event, btn)"
        >
          <i [ngClass]="btn.icon"></i>
        </button>

        <button class="danger" (click)="closeModal($event)">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <ng-content></ng-content>
  </div>
</div>
